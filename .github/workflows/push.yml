on: push
name: Verify the module
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match package engines (>=20). Dev tooling (del-cli/meow, brace-expansion override) requires Node 20+.
        node-version: ["20", "22", "24"]
    steps:
    - uses: actions/checkout@v4
    - name: install
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
    - run: npm ci
    - run: npm run verify_all
